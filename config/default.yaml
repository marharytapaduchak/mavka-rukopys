
# MAVKA — RUKOPYS
# Project configuration for dataset preparation and evaluation.
#
# Model-specific settings and prompts are defined in
# src/rukopys/config.py and the experiment notebooks.

seed: 42

dataset:
  repository: UkrainianCatholicUniversity/rukopys
  metadata_file: train/metadata.jsonl

split:
  validation_fraction: 0.2
  strategy: source_stratified
  page_disjoint: true

paths:
  data: data/
  notebooks: notebooks/
  results: results/
  models: models/

evaluation:
  metrics:
    - detection_f1
    - classification_accuracy
    - cer
    - page_cer

logging:
  level: INFO
